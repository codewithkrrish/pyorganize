[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyorganize"
version = "1.0.0"
description = "Zero-dependency Python CLI that auto-organizes messy folders by file type"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Krrish" }]
keywords = ["cli", "organizer", "files", "productivity", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
pyorganize = "pyorganize.cli:main"

[project.urls]
Homepage = "https://github.com/codewithkrrish/pyorganize"
Issues = "https://github.com/codewithkrrish/pyorganize/issues"

[tool.setuptools.packages.find]
where = ["src"]
